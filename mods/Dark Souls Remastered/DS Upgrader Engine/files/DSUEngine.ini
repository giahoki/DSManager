; DSU Engine: own ambient occlusion, reflections and glow for DARK SOULS REMASTERED.
; Changes apply in game with F11 (re-reads this file and recompiles DSUEngine\shaders\dsu.hlsl).

[General]
Enabled=1
; virtual-key codes: F10=121 effects on/off, F11=122 reload
KeyToggle=121
KeyReload=122
; 1 = write DSUEngine.log next to the game exe (for debugging). Read at game start
Log=0
; 0 off, 1 depth, 2 normals, 3 reflections only, 4 glow only, 5 ambient occlusion only
DebugView=0

[Textures]
; sharper floors, walls and roads seen at an angle. Read when the game starts: F11 doesn't apply it
; 16 max, 0 = keep the game's filtering
Anisotropy=16
; below 0 = sharper textures (may shimmer), above 0 = softer
LodBias=0

[AmbientOcclusion]
Enabled=1
; how dark corners, cracks and contact shadows get
Intensity=1.5
; metres: how far around a point other geometry still shades it
Radius=1.2
; quality: directions per pixel and samples per direction (more = smoother, slower)
Slices=2
Steps=6
; bright lit and glowing pixels keep their light: 0 = AO everywhere, higher = spares them sooner
LightProtect=0.5

[Reflections]
Enabled=1
Intensity=0.6
MaxDistance=40
Steps=48
Thickness=0.6
; only floors, puddles and steps reflect; 0..1 how much walls, characters and the rest may
WallAmount=0
FresnelF0=0.04

[Bloom]
Enabled=1
Intensity=0.06
Threshold=1.5
Knee=0.5
Radius=0.85

[Camera]
; used only while the game's own camera constants are unknown (ambient occlusion off in settings)
FallbackFovY=43
FallbackNear=0.1
FallbackFar=2000
