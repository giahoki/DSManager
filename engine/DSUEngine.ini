; DSU Engine: own reflections and glow for DARK SOULS REMASTERED.
; Changes apply in game with F11 (re-reads this file and recompiles DSUEngine\shaders\dsu.hlsl).

[General]
Enabled=1
; virtual-key codes: F10=121 effects on/off, F11=122 reload
KeyToggle=121
KeyReload=122
; 0 off, 1 depth, 2 normals, 3 reflections only, 4 glow only
DebugView=0

[Reflections]
Enabled=1
Intensity=0.6
MaxDistance=40
Steps=48
Thickness=0.6
; only floors, puddles and steps reflect; 0..1 how much walls, characters and the rest may
WallAmount=0
FresnelF0=0.04

[Bloom]
Enabled=1
Intensity=0.06
Threshold=1.5
Knee=0.5
Radius=0.85

[Camera]
; used only while the game's own camera constants are unknown (ambient occlusion off in settings)
FallbackFovY=43
FallbackNear=0.1
FallbackFar=2000
